<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ianchikexe — Оптимизация</title>
    
    <!-- Подключение технологичных шрифтов -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Базовые настройки и сброс */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --bg-color: #050508;
            --card-bg: rgba(10, 10, 15, 0.7);
            --text-main: #ffffff;
            --text-muted: #64748b;
        }

        body {
            /* Задний фон с твоей GIF и затемнением для читаемости */
            background: linear-gradient(180deg, rgba(5, 5, 8, 0.8) 0%, rgba(5, 5, 8, 0.9) 100%), url('https://i.pinimg.com/originals/69/7c/b0/697cb01edaa30cd11c5c06cc5b924411.gif') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Навигация */
        header {
            width: 100%;
            max-width: 1400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: clamp(20px, 3vw, 40px) clamp(20px, 4vw, 60px);
            z-index: 10;
        }

        .logo {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(18px, 2vw, 26px);
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: lowercase;
        }

        .nav-links {
            display: flex;
            gap: clamp(15px, 3vw, 40px);
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: clamp(12px, 1.2vw, 15px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Главный контейнер */
        .container {
            max-width: 1200px;
            width: 100%;
            padding: 0 clamp(20px, 4vw, 60px) clamp(40px, 6vw, 100px);
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Главный заголовок */
        .headline {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(24px, 4vw, 52px);
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: -1.5px;
            margin-bottom: clamp(40px, 6vw, 80px);
            max-width: 950px;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
        }

        /* Сетка карточек — строго 3 штуки в один ряд на ПК */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(20px, 3vw, 35px);
            width: 100%;
            margin-bottom: clamp(40px, 6vw, 80px);
        }

        /* Обёртка с эффектом стекла */
        .card-wrapper {
            position: relative;
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01));
            border-radius: 20px;
            padding: 1px;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 19px;
            padding: clamp(30px, 4vw, 45px) clamp(25px, 3vw, 35px);
            text-align: left;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Анимация вращающегося свечения краев */
        .card-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, transparent, rgba(255, 255, 255, 0.4), transparent);
            transform: rotate(0deg);
            transition: transform 0.5s linear;
            z-index: 0;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card-wrapper:hover {
            transform: translateY(-10px);
        }

        .card-wrapper:hover::before {
            opacity: 1;
            animation: rotateGlow 3s linear infinite;
        }

        .card-title {
            font-size: clamp(11px, 1.1vw, 13px);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 25px;
            z-index: 1;
        }

        .card-price {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(28px, 3.2vw, 44px);
            font-weight: 900;
            letter-spacing: -1px;
            z-index: 1;
        }

        /* Кнопка Купить */
        .btn-buy {
            display: block;
            width: 100%;
            max-width: clamp(240px, 30vw, 380px);
            padding: clamp(16px, 2vw, 22px) 0;
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(16px, 1.5vw, 20px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #000000;
            background: #ffffff;
            border: none;
            border-radius: 14px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.25);
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .btn-buy:hover {
            transform: scale(1.04);
            background: #000000;
            color: #ffffff;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.6);
            outline: 2px solid rgba(255, 255, 255, 0.8);
        }

        /* Перестроение сетки в один столбец на мобильных и планшетах */
        @media (max-width: 900px) {
            .services-grid {
                grid-template-columns: 1fr;
                max-width: 450px;
            }
            header {
                flex-direction: column;
                gap: 20px;
                padding-bottom: 20px;
            }
            .container {
                padding-top: 20px;
            }
            .card-wrapper::before {
                opacity: 1;
                background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ianchikexe</div>
        <div class="nav-links">
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Reviews</a>
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Channel</a>
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Support</a>
        </div>
    </header>

    <div class="container">
        <h1 class="headline">ianchikexe. Твоя система не думает — она действует</h1>

        <div class="services-grid">
            <!-- Товар 1 -->
            <div class="card-wrapper">
                <div class="card">
                    <div class="card-title">Optimization Windows</div>
                    <div class="card-price">999₽</div>
                </div>
            </div>

            <!-- Товар 2 -->
            <div class="card-wrapper">
                <div class="card">
                    <div class="card-title">Optimization Bluestacks</div>
                    <div class="card-price">999₽</div>
                </div>
            </div>

            <!-- Товар 3 -->
            <div class="card-wrapper">
                <div class="card">
                    <div class="card-title">Virus Removal</div>
                    <div class="card-price">999₽</div>
                </div>
            </div>
        </div>

        <a href="https://t.me" target="_blank" rel="noopener noreferrer" class="btn-buy">Купить</a>
    </div>

</body>
</html>

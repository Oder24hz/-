<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ianchikexe — Оптимизация</title>
    
    <!-- Подключение ультра-жирного шрифта -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        /* Базовые настройки и переменные из твоего старого сайта */
        :root {
            --bg-gif: url('https://i.pinimg.com/originals/31/f0/cb/31f0cbbfe52091e54b2f8157ebd60a8f.gif');
            --card-bg: rgba(10, 10, 15, 0.7);
            --text-main: #FFFFFF;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        /* Задний фон один в один по твоей технологии */
        body {
            background: linear-gradient(180deg, rgba(5, 5, 8, 0.75) 0%, rgba(5, 5, 8, 0.85) 100%), 
                        var(--bg-gif) no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            font-family: 'Unbounded', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* Кнопки навигации строго по центру */
        header {
            width: 100%;
            max-width: 1400px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        .nav-links {
            display: flex;
            gap: 60px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Крупный объемный контейнер */
        .container {
            max-width: 1300px;
            width: 100%;
            padding: 20px 40px 80px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            z-index: 2;
        }

        /* Огромная жирная цитата */
        .headline {
            font-size: 42px;
            font-weight: 900;
            line-height: 1.4;
            letter-spacing: -1px;
            margin-bottom: 60px;
            max-width: 1100px;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
        }

        /* Мощная трехколоночная сетка */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            width: 100%;
            margin-bottom: 60px;
        }

        /* Эффект стекла */
        .card-wrapper {
            position: relative;
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01));
            border-radius: 24px;
            padding: 1px;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 23px;
            padding: 60px 40px;
            text-align: left;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Подсказка при наведении на Custom Bluestacks */
        .card-hint {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 23px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 5;
        }

        .card-wrapper:hover .card-hint {
            opacity: 1;
        }

        /* Анимация вращения неоновых краев при наведении */
        .card-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, transparent, rgba(255, 255, 255, 0.4), transparent);
            transform: rotate(0deg);
            transition: transform 0.5s linear;
            z-index: 0;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card-wrapper:hover {
            transform: translateY(-12px);
        }

        .card-wrapper:hover::before {
            opacity: 1;
            animation: rotateGlow 3s linear infinite;
        }

        .card-title {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
            margin-bottom: 35px;
            z-index: 1;
        }

        .card-price {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -1px;
            z-index: 1;
        }

        /* Прозрачная черная кнопка Купить */
        .btn-buy {
            display: block;
            width: 100%;
            max-width: 440px;
            padding: 24px 0;
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-align: center;
        }

        .btn-buy:hover {
            transform: scale(1.04);
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.5);
        }

        /* Адаптивность под мобилки */
        @media (max-width: 950px) {
            .services-grid {
                grid-template-columns: 1fr;
                max-width: 500px;
            }
            .card-wrapper::before {
                opacity: 1;
                background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent);
            }
        }
    </style>
</head>
<body>

    <!-- Шапка со ссылками -->
    <header>
        <div class="nav-links">
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Reviews</a>
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Channel</a>
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Support</a>
        </div>
    </header>

    <!-- Основной контент -->
    <div class="container">
        <h1 class="headline">@ianchikexe - Система не рассуждает.<br>Система ебашит</h1>

        <div class="services-grid">
            <!-- Карточка 1 -->
            <div class="card-wrapper">
                <div class="card">
                    <div class="card-title">Custom Bluestacks</div>
                    <div class="card-price">1000₽</div>
                    <div class="card-hint">напишу кастомный эмулятор на ваш вкус</div>
                </div>
            </div>

            <!-- Карточка 2 -->
            <div class="card-wrapper">
                <div class="card">
                    <div class="card-title">Windows Optimization</div>
                    <div class="card-price">400₽</div>
                </div>
            </div>

            <!-- Карточка 3 -->
            <div class="card-wrapper">
                <div class="card">
                    <div class="card-title">Optimization CS2</div>
                    <div class="card-price">500₽</div>
                </div>
            </div>
        </div>

        <!-- Кнопка купить -->
        <a href="https://t.me" target="_blank" rel="noopener noreferrer" class="btn-buy">Купить</a>
    </div>

</body>
</html>

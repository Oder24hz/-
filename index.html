<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OderOptimization - Оптимизация систем</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Градиент поверх гифки, чтобы текст оставался читаемым */
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url('./background.gif') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-links a {
            color: #aaa;
            text-decoration: none;
            margin-left: 24px;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #fff;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            padding: 40px 20px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .headline {
            font-size: 34px;
            margin-bottom: 60px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            line-height: 1.3;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            margin-bottom: 60px;
        }

        .card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 35px 25px;
            text-align: left;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.7);
        }

        .card-title {
            font-size: 13px;
            color: #777;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-price {
            font-size: 38px;
            font-weight: bold;
            letter-spacing: -1px;
        }

        .btn-enter {
            display: inline-block;
            align-self: center;
            padding: 16px 50px;
            font-size: 18px;
            font-weight: 600;
            color: #000;
            background: #fff;
            border: 1px solid #fff;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .btn-enter:hover {
            transform: scale(1.03);
            background: transparent;
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.8);
        }

        @media (max-width: 768px) {
            .headline { font-size: 24px; margin-bottom: 40px; }
            .card-price { font-size: 32px; }
            header { flex-direction: column; gap: 20px; text-align: center; padding: 20px; }
            .nav-links a { margin: 0 12px; }
            .services-grid { margin-bottom: 40px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">@OderOptimization</div>
        <div class="nav-links">
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Reviews</a>
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Channel</a>
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Support</a>
        </div>
    </header>

    <div class="container">
        <h1 class="headline">@OderOptimization. Твоя система не думает - она действует</h1>

        <div class="services-grid">
            <div class="card">
                <div class="card-title">Optimization Windows ▼</div>
                <div class="card-price">999₽</div>
            </div>

            <div class="card">
                <div class="card-title">Optimization Bluestacks ▼</div>
                <div class="card-price">999₽</div>
            </div>

            <div class="card">
                <div class="card-title">Virus Removal ▼</div>
                <div class="card-price">999₽</div>
            </div>

            <div class="card">
                <div class="card-title">Configuring Emulator ▼</div>
                <div class="card-price">999₽</div>
            </div>
        </div>

        <a href="https://t.me" target="_blank" rel="noopener noreferrer" class="btn-enter">Войти для покупки</a>
    </div>

</body>
</html>

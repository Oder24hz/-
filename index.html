<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ianchikexe - Оптимизация систем</title>
    <!-- Подключение жирного современного шрифта Inter -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('./background.gif') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .nav-links a {
            color: #b3b3b3;
            text-decoration: none;
            margin-left: 30px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #fff;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            padding: 40px 20px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .headline {
            font-size: 42px;
            margin-bottom: 60px;
            font-weight: 900;
            letter-spacing: -1px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            line-height: 1.2;
        }

        /* Сетка под 3 оставшиеся карточки */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        /* Эффект матового стекла (Glassmorphism) */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: left;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.05);
        }

        .card-title {
            font-size: 13px;
            color: #8c8c8c;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .card-price {
            font-size: 46px;
            font-weight: 900;
            letter-spacing: -1.5px;
        }

        /* Кнопка Купить с жирным текстом и неоновым эффектом */
        .btn-enter {
            display: inline-block;
            align-self: center;
            padding: 18px 65px;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #000;
            background: #fff;
            border: 2px solid #fff;
            border-radius: 10px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .btn-enter:hover {
            transform: scale(1.04);
            background: transparent;
            color: #fff;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.7);
            border-color: rgba(255, 255, 255, 0.9);
        }

        @media (max-width: 768px) {
            .headline { font-size: 28px; margin-bottom: 40px; }
            .card-price { font-size: 36px; }
            header { flex-direction: column; gap: 20px; text-align: center; padding: 20px; }
            .nav-links a { margin: 0 15px; }
            .services-grid { margin-bottom: 40px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">ianchikexe</div>
        <div class="nav-links">
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Reviews</a>
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Channel</a>
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Support</a>
        </div>
    </header>

    <div class="container">
        <h1 class="headline">ianchikexe. Твоя система не думает - она действует</h1>

        <div class="services-grid">
            <div class="card">
                <div class="card-title">Optimization Windows ▼</div>
                <div class="card-price">999₽</div>
            </div>

            <div class="card">
                <div class="card-title">Optimization Bluestacks ▼</div>
                <div class="card-price">999₽</div>
            </div>

            <div class="card">
                <div class="card-title">Virus Removal ▼</div>
                <div class="card-price">999₽</div>
            </div>
        </div>

        <a href="https://t.me" target="_blank" rel="noopener noreferrer" class="btn-enter">Купить</a>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ianchikexe — Оптимизация</title>
    
    <!-- Подключение технологичных шрифтов -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Базовые настройки и сброс */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --bg-color: #050508;
            --card-bg: rgba(10, 10, 15, 0.7);
            --text-main: #ffffff;
            --text-muted: #64748b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
        }

        /* Задний фон через HTML-тег с жестким наложением темного фильтра */
        .bg-gif {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(5, 5, 8, 0.8) 0%, rgba(5, 5, 8, 0.9) 100%);
            z-index: -1;
        }

        /* Навигация — строго по центру сверху */
        header {
            width: 100%;
            max-width: 1400px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(20px, 3vw, 35px) 20px;
            z-index: 10;
        }

        .nav-links {
            display: flex;
            gap: clamp(20px, 4vw, 50px);
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: clamp(12px, 1.2vw, 15px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Главный контейнер */
        .container {
            max-width: 1200px;
            width: 100%;
            padding: 0 clamp(20px, 4vw, 60px) 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        /* Главный заголовок с цитатой */
        .headline {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(20px, 3vw, 40px);
            font-weight: 900;
            line-height: 1.3;
            letter-spacing: -1px;
            margin-top: 20px;
            margin-bottom: clamp(30px, 5vw, 60px);
            max-width: 1000px;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
        }

        /* Сетка карточек — строго 3 штуки в один ряд на ПК */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(20px, 3vw, 35px);
            width: 100%;
            margin-bottom: clamp(40px, 5vw, 60px);
        }

        /* Обёртка с эффектом стекла */
        .card-wrapper {
            position: relative;
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01));
            border-radius: 20px;
            padding: 1px;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 19px;
            padding: clamp(30px, 3.5vw, 45px) clamp(20px, 2.5vw, 30px);
            text-align: left;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Появляющийся кастомный текст при наведении на первую карточку */
        .card-hint {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            text-align: center;
            font-size: clamp(13px, 1.3vw, 17px);
            font-weight: 700;
            color: #ffffff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 5;
        }

        .card-wrapper:hover .card-hint {
            opacity: 1;
        }

        /* Анимация вращающегося свечения краев */
        .card-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, transparent, rgba(255, 255, 255, 0.4), transparent);
            transform: rotate(0deg);
            transition: transform 0.5s linear;
            z-index: 0;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card-wrapper:hover {
            transform: translateY(-10px);
        }

        .card-wrapper:hover::before {
            opacity: 1;
            animation: rotateGlow 3s linear infinite;
        }

        .card-title {
            font-size: clamp(11px, 1vw, 13px);
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 20px;
            z-index: 1;
        }

        .card-price {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(26px, 2.8vw, 40px);
            font-weight: 900;
            letter-spacing: -1px;
            z-index: 1;
        }

        /* Черная прозрачная кнопка Купить */
        .btn-buy {
            display: block;
            width: 100%;
            max-width: clamp(240px, 30vw, 380px);
            padding: clamp(16px, 1.8vw, 20px) 0;
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(15px, 1.3vw, 18px);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            margin-bottom: 20px;
        }

        .btn-buy:hover {
            transform: scale(1.04);
            background: rgba(255, 255, 255, 1);
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
        }

        /* Перестроение сетки в один столбец на мобильных и планшетах */
        @media (max-width: 900px) {
            .services-grid {
                grid-template-columns: 1fr;
                max-width: 450px;
            }
            .card-wrapper::before {
                opacity: 1;
                background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent);
            }
        }
    </style>
</head>
<body>

    <!-- Жестко зафиксированная гифка на фоне -->
    <img class="bg-gif" src="https://pinimg.com" alt="background">
    <div class="bg-overlay"></div>

    <!-- Шапка сайта -->
    <header>
        <div class="nav-links">
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Reviews</a>
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Channel</a>
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Support</a>
        </div>
    </header>

    <!-- Главная секция -->
    <div class="container">
        <!-- Цитата -->
        <h1 class="headline">@ianchikexe - Система не рассуждает. Система ебашит</h1>

        <div class="services-grid">
            <!-- Товар 1 -->
            <div class="card-wrapper">
                <div class="card">
                    <div class="card-title">Custom Bluestacks</div>
                    <div class="card-price">1000₽</div>
                    <div class="card-hint">напишу кастомный эмулятор на ваш вкус</div>
                </div>
            </div>

            <!-- Товар 2 -->
            <div class="card-wrapper">
                <div class="card">
                    <div class="card-title">Windows Optimization</div>
                    <div class="card-price">400₽</div>
                </div>
            </div>

            <!-- Товар 3 -->
            <div class="card-wrapper">
                <div class="card">
                    <div class="card-title">Optimization CS2</div>
                    <div class="card-price">500₽</div>

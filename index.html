<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ianchikexe — Оптимизация</title>
    
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Unbounded:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        /* Чистый фон по прямой ссылке, без градиентов, которые вызывают ошибку */
        body {
            background: url('https://pinimg.com') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Unbounded', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 1400px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        .nav-links {
            display: flex;
            gap: 60px;
            background: rgba(5, 5, 8, 0.85);
            padding: 15px 30px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }

        .nav-links a {
            color: #64748b;
            text-decoration: none;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .container {
            max-width: 1300px;
            width: 100%;
            padding: 20px 40px 80px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            z-index: 2;
        }

        /* Темная подложка под заголовок, чтобы текст не сливался с яркой гифкой */
        .headline {
            font-size: 42px;
            font-weight: 900;
            line-height: 1.4;
            letter-spacing: -1px;
            margin-bottom: 60px;
            max-width: 1100px;
            background: rgba(5, 5, 8, 0.85);
            padding: 20px 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            width: 100%;
            margin-bottom: 60px;
        }

        .card-wrapper {
            position: relative;
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01));
            border-radius: 24px;
            padding: 1px;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Затемнение карточек увеличено для читаемости контента */
        .card {
            background: rgba(5, 5, 8, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 23px;
            padding: 60px 40px;
            text-align: left;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .card-hint {
            position: absolute;
            inset: 0;
            background: rgba(5, 5, 8, 0.98);
            backdrop-filter: blur(15px);
            border-radius: 23px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 5;
        }

        .card-wrapper:hover .card-hint {
            opacity: 1;
        }

        .card-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, transparent, rgba(255, 255, 255, 0.4), transparent);
            transform: rotate(0deg);
            transition: transform 0.5s linear;
            z-index: 0;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card-wrapper:hover {
            transform: translateY(-12px);
        }

        .card-wrapper:hover::before {
            opacity: 1;
            animation: rotateGlow 3s linear infinite;
        }

        .card-title {
            font-size: 13px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
            margin-bottom: 35px;
            z-index: 1;
        }

        .card-price {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -1px;
            z-index: 1;
        }

        .btn-buy {
            display: block;
            width: 100%;
            max-width: 440px;
            padding: 24px 0;
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            background: rgba(5, 5, 8, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-align: center;
        }

        .btn-buy:hover {
            transform: scale(1.04);
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 950px) {
            .services-grid {
                grid-template-columns: 1fr;
                max-width: 500px;
            }
            .card-wrapper::before {
                opacity: 1;
                background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-links">
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Reviews</a>
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Channel</a>
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Support</a>
        </div>
    </header>

    <div class="container">
        <h1 class="headline">@ianchikexe - Система не рассуждает.<br>Система ебашит</h1>

        <div class="services-grid">
            <div class="card-wrapper">
                <div class="card">
                    <div class="card-title">Custom Bluestacks</div>
                    <div class="card-price">1000₽</div>
                    <div class="card-hint">напишу кастомный эмулятор на ваш вкус</div>
                </div>
            </div>

            <div class="card-wrapper">
                <div class="card">
                    <div class="card-title">Windows Optimization</div>
                    <div class="card-price">400₽</div>
                </div>
            </div>

            <div class="card-wrapper">
                <div class="card">
                    <div class="card-title">Optimization CS2</div>
                    <div class="card-price">500₽</div>
                </div>
            </div>
        </div>

        <a href="https://t.me" target="_blank" rel="noopener noreferrer" class="btn-buy">Купить</a>
    </div>

</body>
</html>

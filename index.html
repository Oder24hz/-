    <style>

        * {

        header {

        .nav-links {

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;

            letter-spacing: 2px;

        }

        .container {
            max-width: 1300px;
            width: 100%;
            padding: 0px 40px 80px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            z-index: 2;
            margin-top: 120px;
        }

        .headline {
            font-size: 42px;
            font-weight: 900;
            line-height: 1.4;
            letter-spacing: -1px;
            margin-bottom: 70px;
            max-width: 1100px;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            width: 100%;
            margin-bottom: 70px;
        }

        .card-wrapper {
            position: relative;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.01));
            border-radius: 24px;
            padding: 1px;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 23px;
            padding: 60px 40px;
            text-align: left;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .card-hint {
            position: absolute;
            bottom: -50px;
            left: 40px;
            right: 40px;
            text-align: left;
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease;
            z-index: 5;
            pointer-events: none;
            line-height: 1.3;
        }

        .card-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: rotate(0deg);
            transition: transform 0.5s linear;
            z-index: 0;
            opacity: 0;
            pointer-events: none;
        }

        .card-wrapper:hover::before {
            opacity: 1;
            animation: rotateGlow 2.5s linear infinite;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .first-card {
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.4s ease;
        }

        .first-card:hover {
            transform: translateY(-12px);
            background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.03));
        }

        .first-card:hover .card-hint {
            opacity: 1;
            transform: translateY(-75px);
        }

        .first-card .card-title, .first-card .card-price {
            transition: transform 0.3s ease;
        }

        .first-card:hover .card-title {
            transform: translateY(-15px);
        }

        .first-card:hover .card-price {
            transform: translateY(-25px);
        }

        .static-card {
            transition: background 0.3s ease;
        }

        .static-card:hover {
            background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.02));
        }

        .card-title {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
            margin-bottom: 35px;
            z-index: 1;
        }

        .card-price {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: -1px;
            z-index: 1;
        }

        
        .btn-buy {
            display: block;
            width: 100%;
            max-width: 440px;
            padding: 24px 0;
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .btn-buy::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            transition: 0.75s;
        }

        .btn-buy:hover::after {
            left: 150%;
        }

        .btn-buy:hover {
            transform: scale(1.04);
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 950px) {
            .services-grid {
                grid-template-columns: 1fr;
                max-width: 500px;
            }
            .card-wrapper::before {
                opacity: 1;
                background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent);
            }
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ianchikexe — Оптимизация</title>
    
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #050508;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .bg-gif {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(5, 5, 8, 0.8) 0%, rgba(5, 5, 8, 0.85) 100%);
            z-index: -1;
        }

        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 20px;
            z-index: 10;
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            padding: 0 40px 30px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .headline {
            font-size: 26px;
            font-weight: 900;
            line-height: 1.4;
            margin-bottom: 40px;
            max-width: 900px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            width: 100%;
            margin-bottom: 45px;
        }

        .card-wrapper {
            position: relative;
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01));
            border-radius: 16px;
            padding: 1px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .card {
            background: rgba(10, 10, 15, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 35px 25px;
            text-align: left;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .card-hint {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 15, 0.95);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 5;
        }

        .card-wrapper:hover .card-hint {
            opacity: 1;
        }

        .card-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: rotate(0deg);
            z-index: 0;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card-wrapper:hover {
            transform: translateY(-5px);
        }

        .card-wrapper:hover::before {
            opacity: 1;
            animation: rotateGlow 2.5s linear infinite;
        }

        .card-title {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .card-price {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .btn-buy {
            display: block;
            width: 100%;
            max-width: 320px;
            padding: 16px 0;
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .btn-buy:hover {
            transform: scale(1.03);
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 800px) {
            body { overflow-y: auto; }
            .services-grid { grid-template-columns: 1fr; max-width: 400px; }
            .headline { font-size: 20px; }
        }
    </style>
</head>
<body>

    <img class="bg-gif" src="./background.gif" alt="background">
    <div class="bg-overlay"></div>

    <header>
        <div class="nav-links">
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Reviews</a>
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Channel</a>
            <a href="https://t.me" target="_blank" rel="noopener noreferrer">Support</a>
        </div>
    </header>

    <div class="container">
        <h1 class="headline">@ianchikexe - Система не рассуждает. Система ебашит</h1>

        <div class="services-grid">
            <div class="card-wrapper">
                <div class="card">
                    <div class="card-title">Custom Bluestacks</div>
                    <div class="card-price">1000₽</div>
                    <div class="card-hint">напишу кастомный эмулятор на ваш вкус</div>
                </div>
            </div>

            <div class="card-wrapper">
                <div class="card">
                    <div class="card-title">Windows Optimization</div>
                    <div class="card-price">400₽</div>
                </div>
            </div>

            <div class="card-wrapper">
                <div class="card">
                    <div class="card-title">Optimization CS2</div>
                    <div class="card-price">500₽</div>
                </div>
            </div>
        </div>

        <a href="https://t.me" target="_blank" rel="noopener noreferrer" class="btn-buy">Купить</a>
    </div>

</body>
</html>
